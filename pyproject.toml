[project]
name = "dtypeflow"
version = "1.0.0"
description = "Terminal UI to infer CSV column dtypes and convert CSV to Parquet, locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pedro José Mora Gallegos", email = "developmentbypedrojose@outlook.de" },
]
requires-python = ">=3.11"
keywords = ["csv", "parquet", "dtype", "tui", "textual", "arrow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pyarrow>=17.0.0", "textual>=0.89.0"]

[project.urls]
Homepage = "https://github.com/pedrojosemoragallegos/dtypeflow"
Repository = "https://github.com/pedrojosemoragallegos/dtypeflow"
Issues = "https://github.com/pedrojosemoragallegos/dtypeflow/issues"

[project.scripts]
dtypeflow = "dtypeflow.tui:run"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
